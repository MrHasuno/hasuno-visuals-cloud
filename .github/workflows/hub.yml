name: Rebuild the hub

# Drop a pack in sources/ and push. This rebuilds packs/, previews/ and index.json for you,
# so nobody has to run anything on their own machine.
on:
  push:
    paths:
      - "sources/**"
      - "names.txt"
      - "build_hub.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the catalogue
        run: python3 build_hub.py
      - name: Commit the result
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add index.json packs previews
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "hub: rebuild from sources"
            git push
          fi
